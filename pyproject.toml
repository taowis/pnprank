[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnprank"
version = "0.0.1"
description = "Rank genes by likelihood of causing inherited peripheral neuropathy from cell-type-resolved single-cell expression."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # managed by environment.yml

[project.scripts]
pnprank = "pnprank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
