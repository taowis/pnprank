name: pnprank
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # core
  - numpy
  - pandas
  - scipy
  - pyyaml
  - pyarrow
  # single-cell
  - anndata
  - scanpy
  # R, only to read RDS count matrices deposited by atlas authors
  - r-base
  - r-matrix
  - r-seuratobject
  # modelling
  - scikit-learn
  # plotting
  - matplotlib
  # workflow
  - snakemake-minimal
  # dev
  - pytest
  - ruff
  - requests
