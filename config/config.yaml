# Run settings for pnprank. Values marked TODO are fixed in the stage noted,
# with the reason recorded in docs/decisions.md.

project: pnprank

reference:
  genome_build: GRCh38
  gene_key: ensembl_gene_id     # display: hgnc_symbol
  ensembl_release: 116         # https://rest.ensembl.org/info/data (checked 2026-10-06)
  gencode_release: 50          # Ensembl 116 genebuild, https://rest.ensembl.org/info/genomes/homo_sapiens
  orthology:
    source: Ensembl Compara protein_default homologies, ortholog_one2one only
    release: 116               # mus_musculus dump; MD5 checked against the Ensembl MD5SUM file
    url: https://ftp.ensembl.org/pub/release-116/tsv/ensembl-compara/homologies/mus_musculus/Compara.116.protein_default.homologies.tsv.gz
    table: data/external/orthology/human_mouse_one2one_e116.tsv

truth:
  path: data/truth/neuropathy_genes.tsv
  candidates: data/truth/candidates.tsv
  sources_dir: data/external/truth_sources
  disease_categories: [CMT, dHMN, HSAN, HSP, SYND]
  # Secondary/atypical neuropathy: kept but forced to tier 2 (docs/decisions.md)
  force_tier2: [HMBS, CPOX, PPOX, ADA2, AGXT, SMN1, PDYN, PRNP]
  panelapp_panels:              # Genomics England PanelApp panel IDs
    hereditary_neuropathy: 85
    hereditary_neuropathy_or_pain_gms: 846
    hsp: 165

external:                      # MD5 values are as published by the host (base64)
  gnomad_constraint:
    url: https://storage.googleapis.com/gcp-public-data--gnomad/release/4.1/constraint/gnomad.v4.1.constraint_metrics.tsv
    md5_base64: FN9LKstYH8u7KoKjpVX9NQ==
    dest: data/external/gnomad/gnomad.v4.1.constraint_metrics.tsv
  gtex_median_tpm:
    url: https://storage.googleapis.com/adult-gtex/bulk-gex/v10/rna-seq/GTEx_Analysis_v10_RNASeQCv2.4.2_gene_median_tpm.gct.gz
    md5_base64: E9/dDLc8WJnNCxAq7l7mww==
    dest: data/external/gtex/GTEx_Analysis_v10_RNASeQCv2.4.2_gene_median_tpm.gct.gz
  mouse_gtf:
    url: https://ftp.ensembl.org/pub/release-116/gtf/mus_musculus/Mus_musculus.GRCm39.116.gtf.gz
    bsd_sum: "42607 105329"     # from Ensembl CHECKSUMS (BSD sum)
    dest: data/external/annotation/Mus_musculus.GRCm39.116.gtf.gz

pseudobulk:
  min_cells_per_group: 20      # cell type x donor groups below this are dropped
  min_donors: 2                # cell types must be seen in at least this many donors

pilot:
  atlas: yang2022_human_tg
  cell_type_column: subtype    # author labels: 8 neuron subtypes + 8 non-neuronal types
  donor_column: donor

backtest:
  cutoff_years: [2005, 2008, 2011, 2014, 2017, 2020]  # every 3 years from the first with >= 30 pre-cutoff tier-1 genes
  interval_window_years: 5     # secondary evaluation: genes discovered in [cutoff, cutoff + 5)
  interval_simulation_years: [2005, 2026]  # rank each gene in the year it was discovered
  scoring_folds: 5             # out-of-fold scoring of unlabelled genes at each cutoff
  repeated_cv_seeds: 10        # Stage 4 comparison repeated over seeds (split variance)
  expression_bins: 10          # GTEx mean-expression deciles for the matched evaluation
  interaction_db_release: null # must predate each cutoff, or PPI is dropped (leakage control)

features:
  celltype_map: config/celltype_map.tsv
  atlases:                     # standardised atlases used as features (Stage 4)
    - yang2022_human_tg
    - heming2025_human_sural
    - jung2023_human_drg
    - sparc465_human_sympathetic
    - yadav2023_human_spinal_cord
    - kedlian2024_human_muscle
    - yang2022_mouse_tg
    - stefanovska2025_mouse_sciatic
    - krauter2025_mouse_drg
    - alkaslasi2021_mouse_mn
    - ham2025_mouse_nmj
  gtex_tissues: [Nerve_Tibial, Muscle_Skeletal, Brain_Spinal_cord_cervical_c-1]
  ppi: false                   # PPI dropped from the back-tested model (no pre-cutoff release pinned)

model:
  kinds: [logistic, hgb]       # see src/pnprank/model.py
  cv_folds: 5                  # outer folds (Stage 4 evaluation)
  inner_folds: 3               # hyperparameter tuning, training genes only

release:                       # Stage 6: ranking shipped with the CLI (docs/decisions.md)
  scoring_folds: 5             # same out-of-fold scoring as the back-test
  stability_seeds: 10          # first seed gives the reported percentile; all give its range
  expression_covariate: gtex|mean_all|logtpm
  expression_bins: 10

bootstrap:
  n_resamples: 1000
  ci: 0.95

seeds:
  global: 20261006
