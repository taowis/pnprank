# Run settings for pnprank. Values marked TODO are fixed in the stage noted,
# with the reason recorded in docs/decisions.md.

project: pnprank

reference:
  genome_build: GRCh38
  gene_key: ensembl_gene_id     # display: hgnc_symbol
  ensembl_release: 116         # https://rest.ensembl.org/info/data (checked 2026-10-06)
  gencode_release: 50          # Ensembl 116 genebuild, https://rest.ensembl.org/info/genomes/homo_sapiens
  orthology:
    source: Ensembl Compara protein_default homologies, ortholog_one2one only
    release: 116               # mus_musculus dump; MD5 checked against the Ensembl MD5SUM file
    url: https://ftp.ensembl.org/pub/release-116/tsv/ensembl-compara/homologies/mus_musculus/Compara.116.protein_default.homologies.tsv.gz
    table: data/external/orthology/human_mouse_one2one_e116.tsv

truth:
  path: data/truth/neuropathy_genes.tsv
  candidates: data/truth/candidates.tsv
  sources_dir: data/external/truth_sources
  disease_categories: [CMT, dHMN, HSAN, HSP, SYND]
  # Secondary/atypical neuropathy: kept but forced to tier 2 (docs/decisions.md)
  force_tier2: [HMBS, CPOX, PPOX, ADA2, AGXT, SMN1, PDYN, PRNP]
  panelapp_panels:              # Genomics England PanelApp panel IDs
    hereditary_neuropathy: 85
    hereditary_neuropathy_or_pain_gms: 846
    hsp: 165

backtest:
  cutoff_years: []             # TODO (Stage 1/5): chosen after the truth set's year distribution is known
  interval_window_years: null  # TODO (Stage 5)
  interaction_db_release: null # must predate each cutoff, or PPI is dropped (see CLAUDE leakage controls)

model:
  type: null                   # TODO (Stage 4)
  cv_folds: 5                  # inner CV, pre-cutoff genes only
  hyperparameters: {}

bootstrap:
  n_resamples: 1000
  ci: 0.95

seeds:
  global: 20261006
